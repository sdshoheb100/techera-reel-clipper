name: Clip & Brand Reel (Mobile Trigger)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Source Video URL (TikTok / YouTube / Direct MP4)"
        required: true
        default: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
      product_name:
        description: "Product Name Overlay"
        required: false
        default: "TechEra BD Smart Gadget"
      price_text:
        description: "Price Text (e.g. Tk 1,290)"
        required: false
        default: "Tk 1,290"
      clip_seconds:
        description: "Clip Duration in Seconds"
        required: false
        default: "12"

jobs:
  clip_and_render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install yt-dlp
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Process & Render Copyright-Safe Reel
        run: |
          python process_video.py --url "${{ github.event.inputs.video_url }}" --product "${{ github.event.inputs.product_name }}" --price "${{ github.event.inputs.price_text }}" --seconds "${{ github.event.inputs.clip_seconds }}"
      - name: Upload Ready Reel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ready-reel-${{ github.run_number }}
          path: |
            output/ready_reel.mp4
            output/metadata.json
          retention-days: 7
