name: TechEra AI Market & Reel Engine (v0.2.0)

on:
  schedule:
    # Daily trend scan & fresh StoreLine product Reel at 09:00 AM Bangladesh Time (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Engine Mode (store_product_reel = 100% Zero-Fail)"
        type: choice
        required: true
        default: "store_product_reel"
        options:
          - store_product_reel
          - daily_trend_report
          - auto_trending_reel
          - custom_video_reel
      niche:
        description: "Product Category / Niche"
        type: choice
        required: false
        default: "all"
        options:
          - all
          - fashion_design
          - tech_gadgets
          - mobile_audio
          - smart_home_tech
      video_urls:
        description: "Custom Direct MP4 URLs (only for custom_video_reel)"
        required: false
        default: ""
      product_name:
        description: "Top Header / Product Title"
        required: false
        default: "TechEra BD"
      price_text:
        description: "Optional Price Override (leave blank for automatic store prices)"
        required: false
        default: ""
      clip_seconds:
        description: "Seconds per Product Clip"
        required: false
        default: "3.5"
      max_clips:
        description: "Number of Products to Feature (1 to 4)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  run_ai_engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TechEra AI Engine (v0.2.0)
        run: |
          python main.py \
            --mode "${{ github.event.inputs.mode || 'store_product_reel' }}" \
            --niche "${{ github.event.inputs.niche || 'all' }}" \
            --urls "${{ github.event.inputs.video_urls || '' }}" \
            --product "${{ github.event.inputs.product_name || 'TechEra BD' }}" \
            --price "${{ github.event.inputs.price_text || '' }}" \
            --clip-seconds "${{ github.event.inputs.clip_seconds || '3.5' }}" \
            --max-clips "${{ github.event.inputs.max_clips || '3' }}"

      - name: Publish Ready Reel & Live Feed to Mobile App
        run: |
          git config user.name "TechEra AI Bot"
          git config user.email "bot@techerabd.local"
          git add data/learning_memory.json docs/data/ docs/reels/
          git diff --staged --quiet || git commit -m "feat(reels): publish fresh AI Reel & live trends to Mobile App"
          git push

      - name: Upload Output Artifacts (Backup Download)
        uses: actions/upload-artifact@v4
        with:
          name: techera-reel-${{ github.run_number }}
          path: |
            output/
          retention-days: 7
